Name: api.gateway
Host: 0.0.0.0
Port: 8080

# Prometheus for REST gateway
Prometheus:
  Host: 0.0.0.0
  Port: 9100
  Path: /metrics

Log:
  Mode: console
  Level: info

# gRPC client config
MMNRpc:
  Name: mmn.grpc
  ListenOn: 0.0.0.0:9090
  MaxRetries: 3
  
  Target: "localhost:9001,localhost:9002,localhost:9003"
  ServiceConfig: '{"loadBalancingPolicy":"round_robin"}'
  # Enable Prometheus for gRPC
  Prometheus:
    Host: 0.0.0.0
    Port: 9101
    Path: /metrics
